[project]
name = "jeemu-webapp"
version = "1.0.0"
description = "Jeemu Tabletop Console Backend & Webapp"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "stripe>=10.0.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "requests>=2.32.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend", "api"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]
ignore = [
    "E501", # line-too-long (handled by ruff format)
    "B008", # function call in argument defaults (FastAPI Depends() standard pattern)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

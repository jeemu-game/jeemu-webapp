<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="theme-color" content="#0a0c0e">
  <title>Jeemu | Tower game, Kickstarter in November</title>
  
  <meta name="description" content="Jeemu is a tower game. Pull a block, tap it on the base, and the screen asks you something. We help people achieve deeper connections without the awkwardness of starting the conversation. Kickstarter in November.">
  <meta name="keywords" content="Jeemu, NFC tower game, tabletop game, conversation game, party game, Kickstarter">
  
  <!-- Open Graph / Social Sharing -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://jeemu.fun/">
  <meta property="og:title" content="Jeemu: a tower game that starts the conversation">
  <meta property="og:description" content="A tower game. We help people achieve deeper connections without the awkwardness of starting the conversation. Kickstarter in November, early bird $89.99.">
  <meta property="og:image" content="https://jeemu.fun/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Fonts: a <link> (not a CSS @import) so the browser fetches them in parallel with the app instead of after its CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Pixelify+Sans:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/story/frog-pixel.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <!-- Start fetching the first frame and the timeline before the app's JavaScript has run. Same phone / desktop
       rule as StoryPlayer (portrait window = phone render). -->
  <link rel="preload" as="image" href="/story/mobile/poster.jpg" media="(max-aspect-ratio: 749/1000)" fetchpriority="high">
  <link rel="preload" as="fetch" href="/story/mobile/timeline.json" crossorigin media="(max-aspect-ratio: 749/1000)">
  <link rel="preload" as="image" href="/story/poster.jpg" media="(min-aspect-ratio: 750/1000)" fetchpriority="high">
  <link rel="preload" as="fetch" href="/story/timeline.json" crossorigin media="(min-aspect-ratio: 750/1000)">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
